<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Biểu mẫu ứng tuyển</title>
</head>
<body style="font-family: 'Times New Roman', Times, serif, sans-serif; background-color: white; padding: 30px;">

    <form action="#" method="post" style="max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 8px; border: 1px solid #ddd;">
        
        <h2 style="text-align: center; color: #101010;">ĐĂNG KÝ ỨNG TUYỂN</h2>

        <label>Họ và tên:</label><br>
        <input type="text" name="fullname" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"><br>

        <label>Địa chỉ Email:</label><br>
        <input type="email" name="email" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"><br>

        <label>Số điện thoại:</label><br>
        <input type="tel" name="phone" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"><br>

        <label>Thư giới thiệu bản thân:</label><br>
        <textarea name="cover_letter" rows="4" style="width: 100%; padding: 8px; margin: 5px 0 15px 0; box-sizing: border-box;"></textarea><br>

        <label>Tải lên CV/Resume:</label><br>
        <input type="file" name="resume" accept=".pdf,.doc,.docx" required style="margin: 5px 0 20px 0;"><br>

        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer;">
            Gửi biểu mẫu
        </button>

    </form>

</body>
</html>
